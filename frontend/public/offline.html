<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splitta — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #e9ebec;
        --surface: #ffffff;
        --ink: #0b0c0d;
        --ink-3: #6b7279;
        --brand: #d4f84e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #08090a;
          --surface: #121415;
          --ink: #eef1f2;
          --ink-3: #6b7279;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: var(--brand);
        display: grid;
        place-items: center;
        font-size: 26px;
      }
      h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; font-size: 14.5px; color: var(--ink-3); }
      button {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: #0b0c0d;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">📴</div>
      <h1>You are offline</h1>
      <p>
        Splitta needs a connection to load your balances. Anything you already
        saved is safe on the server.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
